<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码保险箱</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 自绘窗口标题栏（无边框窗口：拖拽移动窗口，按钮控制窗口） -->
<div id="titlebar" class="titlebar">
  <div class="tb-brand">
    <span class="tb-logo">密</span>
    <span class="tb-name">密码保险箱</span>
  </div>
  <div class="tb-actions">
    <button id="tb-min" class="tb-btn" type="button" title="最小化">&#x2013;</button>
    <button id="tb-max" class="tb-btn" type="button" title="最大化">&#x25A1;</button>
    <button id="tb-close" class="tb-btn tb-close" type="button" title="关闭">&#x2715;</button>
  </div>
</div>

<!-- 解锁 / 创建屏 -->
<div id="screen-lock" class="screen">
  <div class="lock-card">
    <div class="logo">密</div>
    <h1 class="app-title">密码保险箱</h1>
    <p class="app-sub">国密加密 · 数据仅存本地</p>

    <div id="lock-mode" class="lock-form">
      <label class="lab">主密码</label>
      <div class="input-group">
        <input id="lock-pass" type="password" class="inp" autocomplete="off" placeholder="请输入主密码">
        <button id="lock-toggle" class="btn ghost btn-sm" type="button">显示</button>
      </div>
      <button id="lock-submit" class="btn primary btn-lg" type="button">解锁</button>
      <p class="lock-note">主密码不会上传 · 忘记将无法恢复数据</p>
    </div>

    <div id="create-mode" class="lock-form hidden">
      <label class="lab">设置主密码</label>
      <div class="input-group">
        <input id="create-pass" type="password" class="inp" autocomplete="off" placeholder="至少 12 位">
        <button class="btn ghost btn-sm toggle-pass" type="button" data-target="create-pass">显示</button>
      </div>
      <label class="lab" style="margin-top:12px;">确认主密码</label>
      <div class="input-group">
        <input id="create-pass2" type="password" class="inp" autocomplete="off" placeholder="再次输入">
        <button class="btn ghost btn-sm toggle-pass" type="button" data-target="create-pass2">显示</button>
      </div>
      <button id="create-submit" class="btn primary btn-lg" type="button">创建保险箱</button>
      <p class="lock-note">主密码无法找回 · 请牢记并妥善备份库文件</p>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="screen-main" class="screen hidden">
  <header class="topbar">
    <input id="search" class="inp search" type="text" placeholder="搜索标题或账号">
    <div class="top-actions">
      <button id="btn-backup" class="btn ghost btn-sm" type="button">备份</button>
      <button id="btn-restore" class="btn ghost btn-sm" type="button">恢复</button>
      <button id="btn-settings" class="btn ghost btn-sm" type="button">设置</button>
    </div>
  </header>
  <div class="main-body">
    <aside class="sidebar">
      <button id="btn-add" class="btn primary btn-lg" type="button">＋ 新建凭据</button>
      <ul id="entry-list" class="entry-list"></ul>
      <div class="sidebar-foot">
        <span id="entry-count" class="count">共 0 条凭据</span>
        <div class="foot-row">
          <button id="btn-trash" class="trash-btn" type="button">回收站<span id="trash-count" class="trash-count"></span></button>
          <button id="btn-lock" class="btn ghost btn-sm" type="button">锁定</button>
        </div>
      </div>
    </aside>
    <section class="detail" id="detail">
      <div id="detail-empty" class="detail-empty">从左侧选择一条凭据查看详情</div>
      <div id="detail-body" class="hidden">
        <h2 id="d-title" class="detail-title"></h2>
        <div class="detail-card">
          <div class="field">
            <span class="lab">账号</span>
            <span id="d-username" class="field-value"></span>
          </div>
          <div class="field" id="d-field-address">
            <span class="lab">地址</span>
            <span id="d-address" class="mono field-value"></span>
          </div>
          <div class="field" id="d-field-port">
            <span class="lab">端口</span>
            <span id="d-port" class="mono field-value"></span>
          </div>
          <div class="field" id="d-field-note">
            <span class="lab">备注</span>
            <span id="d-note" class="field-value"></span>
          </div>
          <div class="field" id="d-field-pass">
            <span class="lab">密码</span>
            <div class="password-row">
              <span id="d-password" class="mono field-value"></span>
              <button id="d-toggle" class="btn ghost btn-sm" type="button">显示</button>
              <button id="d-copy" class="btn primary btn-sm" type="button">复制密码</button>
            </div>
            <span class="field-note">复制后 30 秒自动清空剪贴板</span>
          </div>
          <div class="ops-zone">
            <button id="d-edit" class="btn ghost btn-sm" type="button">编辑凭据</button>
          </div>
          <div class="danger-zone">
            <div id="d-ops-trash" class="hidden">
              <button id="d-restore" class="btn primary btn-sm" type="button">恢复凭据</button>
              <button id="d-purge" class="btn danger" type="button">彻底删除</button>
            </div>
            <button id="d-delete" class="btn danger" type="button">删除凭据</button>
          </div>
        </div>
        <div id="d-created" class="meta"></div>
      </div>
    </section>
  </div>
</div>

<!-- 添加 / 编辑凭据弹窗 -->
<div id="modal-add" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head" id="add-head">添加凭据<button id="add-close" class="modal-x" type="button">×</button></div>
    <div class="modal-body">
      <label class="lab">标题</label>
      <input id="add-title" class="inp" type="text" placeholder="例如：生产数据库">
      <label class="lab" style="margin-top:12px;">账号</label>
      <input id="add-username" class="inp" type="text" placeholder="例如：dbadmin">
      <label class="lab" style="margin-top:12px;">地址（IP / 域名，可选）</label>
      <input id="add-address" class="inp" type="text" placeholder="例如：192.168.1.10">
      <label class="lab" style="margin-top:12px;">端口（可选）</label>
      <input id="add-port" class="inp" type="text" inputmode="numeric" placeholder="例如：3306">
      <label class="lab" style="margin-top:12px;">备注（可选）</label>
      <input id="add-note" class="inp" type="text" placeholder="例如：生产环境，禁止随意变更">
      <label class="lab" style="margin-top:12px;">密码</label>
      <input id="add-password" class="inp" type="password" placeholder="请输入密码">
      <div class="modal-foot">
        <button id="add-cancel" class="btn ghost" type="button">取消</button>
        <button id="add-save" class="btn primary" type="button">保存</button>
      </div>
      <p class="modal-note">保存后以 SM4-GCM 加密写入本地库文件</p>
    </div>
  </div>
</div>


<!-- 设置弹窗（修改主密码） -->
<div id="modal-settings" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">设置<button id="set-close" class="modal-x" type="button">×</button></div>
    <div class="modal-body">
      <label class="lab">当前主密码</label>
      <input id="set-old" class="inp" type="password" autocomplete="off" placeholder="请输入当前主密码">
      <label class="lab" style="margin-top:12px;">新主密码</label>
      <input id="set-new" class="inp" type="password" autocomplete="off" placeholder="至少 12 位，含大写/小写/数字/符号三类">
      <label class="lab" style="margin-top:12px;">确认新主密码</label>
      <input id="set-new2" class="inp" type="password" autocomplete="off" placeholder="再次输入新主密码">
      <div class="modal-foot">
        <button id="set-cancel" class="btn ghost" type="button">取消</button>
        <button id="set-save" class="btn primary" type="button">修改主密码</button>
      </div>
      <p class="modal-note">修改后请牢记新主密码 · 忘记将无法恢复数据</p>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
